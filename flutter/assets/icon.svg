<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="iconPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>

    <filter id="iconNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="256" height="256" rx="56" fill="#0A0F1D" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="url(#iconPrimaryGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Símbolo VyasConect centralizado -->
  <g transform="translate(48, 48)">
    <!-- Glow -->
    <circle cx="80" cy="80" r="60" fill="url(#iconGlow)" opacity="0.2" />
    
    <!-- Linhas V -->
    <line x1="80" y1="130" x2="25" y2="35" stroke="url(#iconPrimaryGrad)" stroke-width="14" stroke-linecap="round" filter="url(#iconNeon)" />
    <line x1="80" y1="130" x2="135" y2="35" stroke="url(#iconPrimaryGrad)" stroke-width="14" stroke-linecap="round" filter="url(#iconNeon)" />

    <!-- Traço interno de reflexo -->
    <path d="M 45 42 L 80 105 L 115 42" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Nós de Rede -->
    <circle cx="25" cy="35" r="14" fill="#0A0F1D" stroke="#00F0FF" stroke-width="5" />
    <circle cx="25" cy="35" r="5" fill="#00F0FF" />

    <circle cx="135" cy="35" r="14" fill="#0A0F1D" stroke="#7000FF" stroke-width="5" />
    <circle cx="135" cy="35" r="5" fill="#9D4EDD" />

    <circle cx="80" cy="130" r="18" fill="#0A0F1D" stroke="url(#iconPrimaryGrad)" stroke-width="6" />
    <circle cx="80" cy="130" r="7" fill="#00F0FF" />

    <!-- Ondas Superiores -->
    <path d="M 60 16 A 26 26 0 0 1 100 16" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>

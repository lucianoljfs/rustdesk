<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="24" fill="#0B0F19" />
  
  <!-- Subtle Grid Accent -->
  <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 160 0 V 240 M 320 0 V 240 M 480 0 V 240 M 640 0 V 240" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- SÍMBOLO / ÍCONE (V estilizado com Nós de Conectividade) -->
  <g transform="translate(60, 40)">
    <!-- Aura de fundo -->
    <circle cx="80" cy="80" r="70" fill="url(#glowGrad)" opacity="0.15" />
    
    <!-- Linhas de conexão (Link mesh) -->
    <line x1="80" y1="135" x2="25" y2="35" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />
    <line x1="80" y1="135" x2="135" y2="35" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Traço interno de alta velocidade -->
    <path d="M 45 42 L 80 110 L 115 42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Pulsos / Nós de Rede -->
    <!-- Nó Esquerdo -->
    <circle cx="25" cy="35" r="14" fill="#0B0F19" stroke="#00F0FF" stroke-width="5" />
    <circle cx="25" cy="35" r="5" fill="#00F0FF" />

    <!-- Nó Direito -->
    <circle cx="135" cy="35" r="14" fill="#0B0F19" stroke="#7000FF" stroke-width="5" />
    <circle cx="135" cy="35" r="5" fill="#9D4EDD" />

    <!-- Nó Central Inferior (Core) -->
    <circle cx="80" cy="135" r="18" fill="#0B0F19" stroke="url(#primaryGrad)" stroke-width="6" />
    <circle cx="80" cy="135" r="7" fill="#00F0FF" />

    <!-- Ondas de Sinal Wireless / Conectividade P2P -->
    <path d="M 60 16 A 28 28 0 0 1 100 16" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 48 5 A 42 42 0 0 1 112 5" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- TIPOGRAFIA -->
  <g transform="translate(245, 125)">
    <!-- VYAS -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="1">
      VYAS
    </text>

    <!-- CONECT -->
    <text x="180" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="url(#primaryGrad)" letter-spacing="0.5">
      CONECT
    </text>

    <!-- SLOGAN / SUBTITLE -->
    <text x="2" y="38" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="4">
      INFRAESTRUTURA &amp; SUPORTE REMOTO PRIVADO
    </text>
  </g>
</svg>